<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>gridloom</title><link rel="stylesheet" href="src/panel.css"></head>
<body><main>
 <div id="preview-note" class="notice" data-i18n="Browser only · Illustrator not connected" hidden>Browser only · Illustrator not connected</div>
 <div class="quick" aria-label="Quick guides" data-i18n-aria="Quick guides"><button data-quick="left" data-i18n="Left">Left</button><button data-quick="center" data-i18n="Center">Center</button><button data-quick="right" data-i18n="Right">Right</button><button id="clear" data-i18n="Clear">Clear</button><button data-quick="top" data-i18n="Top">Top</button><button data-quick="middle" data-i18n="Middle">Middle</button><button data-quick="bottom" data-i18n="Bottom">Bottom</button></div>
 <div class="tabbar"><nav role="tablist" aria-label="Mode" data-i18n-aria="Mode"><button id="tab-grid" role="tab" aria-selected="true" aria-controls="page-grid" data-tab="grid" data-i18n="Grid">Grid</button><button id="tab-notation" role="tab" aria-selected="false" aria-controls="page-notation" data-tab="notation" data-i18n="Custom">Custom</button><button id="tab-presets" role="tab" aria-selected="false" aria-controls="page-presets" data-tab="presets" data-i18n="Saved">Saved</button></nav><button id="lock-guides" class="quiet" data-i18n="Lock / unlock guides">Lock / unlock guides</button><button id="visibility" class="quiet" data-i18n="Show / hide">Show / hide</button></div>
 <div id="panel-content"><div id="content-layout">
 <div class="pages">
 <div id="page-grid" role="tabpanel" aria-labelledby="tab-grid">
  <section><div class="heading"><span data-i18n="Margins">Margins</span><label class="check"><input id="linked" type="checkbox" checked><span data-i18n="Link">Link</span></label></div><div class="fields four"><label><span data-i18n="Top">Top</span><input id="margin-top" value="12mm"></label><label><span data-i18n="Right">Right</span><input id="margin-right" value="12mm"></label><label><span data-i18n="Bottom">Bottom</span><input id="margin-bottom" value="12mm"></label><label><span data-i18n="Left">Left</span><input id="margin-left" value="12mm"></label></div></section>
  <section><div class="heading"><span data-i18n="Columns">Columns</span><output id="column-result" class="subtle"></output></div><div class="fields three"><label><span data-i18n="Count">Count</span><span class="count-control"><input id="cols" type="number" min="0" max="1000" value="12" data-i18n-placeholder="Auto" placeholder="Auto"><button type="button" id="cols-toggle" class="slider-toggle" aria-expanded="false" aria-controls="cols-slider" data-i18n-aria="Adjust columns"></button></span></label><label><span data-i18n="Width">Width</span><input id="colWidth" data-i18n-placeholder="Auto" placeholder="Auto"></label><label><span data-i18n="Gutter">Gutter</span><input id="gutterX" value="4mm"></label></div><div id="cols-slider" class="count-slider" hidden><input id="cols-range" type="range" min="0" max="24" step="1" data-i18n-aria="Columns"><div class="slider-labels"><span data-i18n="Fewer">Fewer</span><span data-i18n="More">More</span></div></div></section>
  <section><div class="heading"><span data-i18n="Rows">Rows</span><output id="row-result" class="subtle"></output></div><div class="fields three"><label><span data-i18n="Count">Count</span><span class="count-control"><input id="rows" type="number" min="0" max="1000" value="0" data-i18n-placeholder="Auto" placeholder="Auto"><button type="button" id="rows-toggle" class="slider-toggle" aria-expanded="false" aria-controls="rows-slider" data-i18n-aria="Adjust rows"></button></span></label><label><span data-i18n="Height">Height</span><input id="rowHeight" data-i18n-placeholder="Auto" placeholder="Auto"></label><label><span data-i18n="Gutter">Gutter</span><input id="gutterY" value="4mm"></label></div><div id="rows-slider" class="count-slider" hidden><input id="rows-range" type="range" min="0" max="24" step="1" data-i18n-aria="Rows"><div class="slider-labels"><span data-i18n="Fewer">Fewer</span><span data-i18n="More">More</span></div></div></section>
 </div>
 <div id="page-notation" role="tabpanel" aria-labelledby="tab-notation" hidden><section><label><span>Grid Notation</span><textarea id="notation" spellcheck="false" rows="7">$row = | 16px |
$row* (h)</textarea></label><details><summary data-i18n="Syntax examples">Syntax examples</summary><div class="syntax-help"><p data-i18n="syntaxIntro"></p><p data-i18n="syntaxThirds"></p><code>| ~ | ~ | ~ | (v)</code><p data-i18n="syntaxBaseline"></p><code>$row = | 16pt |
$row* (h)</code><p data-i18n="syntaxMore"></p></div></details></section></div>
 <div id="page-presets" role="tabpanel" aria-labelledby="tab-presets" hidden><section><div id="preset-cards" class="preset-cards"><button id="save" class="preset-card add-preset" aria-label="Save preset"><span aria-hidden="true">＋</span><span data-i18n="Add">Add</span></button></div><div id="preset-list" class="preset-cards"></div><div class="actions"><button id="import" data-i18n="Import">Import</button><button id="export" data-i18n="Export">Export</button><input id="import-file" type="file" accept="application/json,.json" hidden></div></section></div>
 </div>
 <details id="options"><summary data-i18n="Position & settings">Position & settings</summary><section><div class="fields"><label><span data-i18n="Horizontal">Horizontal</span><select id="alignX"><option value="start" data-i18n="Left">Left</option><option value="center" data-i18n="Center">Center</option><option value="end" data-i18n="Right">Right</option></select></label><label><span data-i18n="Vertical">Vertical</span><select id="alignY"><option value="start" data-i18n="Top">Top</option><option value="center" data-i18n="Middle">Middle</option><option value="end" data-i18n="Bottom">Bottom</option></select></label><label class="full"><span data-i18n="Book mode">Book mode</span><select id="book"><option value="none" data-i18n="Off">Off</option><option value="horizontal" data-i18n="Left / right pages">Left / right pages</option><option value="vertical" data-i18n="Top / bottom pages">Top / bottom pages</option></select></label><label><span data-i18n="Write mode">Write mode</span><select id="write-mode"><option value="replace" data-i18n="Replace this grid">Replace this grid</option><option value="append" data-i18n="Append">Append</option></select></label></div><label class="check"><input id="border" type="checkbox"><span data-i18n="Include outer edges">Include outer edges</span></label></section></details>
 <section id="save-form" hidden><label><span data-i18n="Preset name">Preset name</span><input id="preset-name" maxlength="80"></label><div class="actions"><button id="save-cancel" data-i18n="Cancel">Cancel</button><button id="save-confirm" data-i18n="Save">Save</button></div></section>
 </div></div>
 <footer><output id="status" role="status" aria-live="polite"></output><div class="actions"><button id="reset" data-i18n="Reset form">Reset form</button><button id="live-cancel" data-i18n="Cancel" hidden>Cancel</button><button id="apply" class="primary" data-i18n="Add guides">Add guides</button></div></footer>
</main><script src="src/core.js"></script><script src="src/notation.js"></script><script src="src/presets.js"></script><script src="src/host.js"></script><script src="src/i18n.js"></script><script src="src/icons.js"></script><script src="src/live.js"></script><script src="src/panel.js"></script></body></html>
